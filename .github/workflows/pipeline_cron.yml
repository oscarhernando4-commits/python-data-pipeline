name: 🤖 Quant Trading Engine (trigger_quant_trade)

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  repository_dispatch: # External 5m trigger from Cron-Job.org / UptimeRobot
    types: [trigger_quant_trade]

jobs:
  trade_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Requirements Fast
        run: |
          pip install requests numpy pandas ta urllib3
      - name: 🚀 Execute 100-Account Live Matrix & Dynamic Market Rotation
        env:
          BINANCE_REAL_API_KEY: ${{ secrets.BINANCE_REAL_API_KEY }}
          BINANCE_REAL_API_SECRET: ${{ secrets.BINANCE_REAL_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          python data_fetcher.py
          python pipeline_processor.py
          
      - name: 💾 Commit & Push Real-Time Matrix Updates
        run: |
          git config --global user.name 'antigravity-bot[bot]'
          git config --global user.email 'antigravity-bot[bot]@users.noreply.github.com'
          for i in 1 2 3; do
            git fetch origin main || true
            git reset --soft origin/main || true
            git add .
            git commit -m "chore: pipeline data sync [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" || break
            git push origin main && break || sleep 3
          done
