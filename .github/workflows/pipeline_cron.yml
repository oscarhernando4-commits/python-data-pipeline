name: 🤖 Quant Trading Engine (4-Hour Continuous Runner)

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime
  schedule:
    - cron: '0 */4 * * *' # Native GitHub Cron: Starts a fresh 4-hour worker every 4 hours
  repository_dispatch:
    types: [trigger_quant_trade] # External trigger from Cron-Job.org (set to Cada 4 horas)

concurrency:
  group: "continuous-quant-engine"
  cancel-in-progress: true # Automatically cancels previous running instance when new 4-hour cron arrives

jobs:
  continuous_trade_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 270 # 4.5 hours hard limit
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Requirements Fast
        run: |
          pip install requests numpy pandas ta urllib3

      - name: 🚀 Execute 4-Hour Continuous Quant Trading Loop (Every 5m)
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BINANCE_REAL_API_KEY: ${{ secrets.BINANCE_REAL_API_KEY }}
          BINANCE_REAL_API_SECRET: ${{ secrets.BINANCE_REAL_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          python cloud_continuous_loop.py

