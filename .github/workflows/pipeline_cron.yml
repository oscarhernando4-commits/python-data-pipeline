name: 🤖 Quant Trading Engine (4-Hour Continuous Runner)

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime
  repository_dispatch:
    types: [trigger_quant_trade] # External trigger from Cron-Job.org (set to Cada 4 horas a las :56)
  schedule:
    - cron: '0 */4 * * *' # Backup: native GitHub cron every 4 hours (safety net if Cron-Job.org fails)

concurrency:
  group: "continuous-quant-engine"
  cancel-in-progress: true # Automatically cancels previous running instance when new 4-hour cron arrives

jobs:
  continuous_trade_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 270 # 4.5 hours hard limit
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Requirements Fast
        run: |
          pip install -r requirements.txt

      - name: 🚀 Execute 4-Hour Continuous Quant Trading Loop
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BINANCE_REAL_API_KEY: ${{ secrets.BINANCE_REAL_API_KEY }}
          BINANCE_REAL_API_SECRET: ${{ secrets.BINANCE_REAL_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_02: ${{ secrets.GEMINI_API_KEY_02 }}
          GEMINI_API_KEY_03: ${{ secrets.GEMINI_API_KEY_03 }}
          GEMINI_API_KEY_04: ${{ secrets.GEMINI_API_KEY_04 }}
          GEMINI_API_KEY_05: ${{ secrets.GEMINI_API_KEY_05 }}
          GEMINI_API_KEY_06: ${{ secrets.GEMINI_API_KEY_06 }}
          GEMINI_API_KEY_07: ${{ secrets.GEMINI_API_KEY_07 }}
          GEMINI_API_KEY_08: ${{ secrets.GEMINI_API_KEY_08 }}
          GEMINI_API_KEY_09: ${{ secrets.GEMINI_API_KEY_09 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          python cloud_continuous_loop.py
