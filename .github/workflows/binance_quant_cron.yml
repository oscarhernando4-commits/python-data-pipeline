name: Binance Quant Trading Engine 24/7 (Cron 5M Cloud)

on:
  schedule:
    # Runs every 12 minutes 24/7 in GitHub Cloud (Consumes ~72% of CMC Daily Limit)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  repository_dispatch: # Allows instant external 5m pings from Cron-Job.org / UptimeRobot
    types: [trigger_quant_trade]

jobs:
  trade_and_sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pandas ta urllib3
      - name: 🚀 Execute 100-Account Live Matrix & Dynamic Market Rotation
        env:
          BINANCE_REAL_API_KEY: ${{ secrets.BINANCE_REAL_API_KEY }}
          BINANCE_REAL_API_SECRET: ${{ secrets.BINANCE_REAL_API_SECRET }}
          FIXIE_URL: ${{ secrets.FIXIE_URL || 'http://fixie:yqYN8TxTpLkrqC0@ventoux.usefixie.com:80' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          python update_top_100_pairs.py
          python parallel_simulation_matrix.py
          
      - name: 💾 Commit & Push Real-Time Matrix Updates
        run: |
          git config --global user.name 'antigravity-bot[bot]'
          git config --global user.email 'antigravity-bot[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto-Update: Live 100-Account Matrix Cycle [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" || echo "No changes to commit"
          git push origin main
