name: Binance Quant Trading Engine 24/7 (Cron 5M Cloud)

on:
  schedule:
    # Runs every 5 minutes 24/7 in GitHub Cloud for high-frequency market scanning & trading
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  trade_and_sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests numpy pandas ta urllib3; fi

      - name: 🔑 Verify Real Binance API Connection
        env:
          BINANCE_REAL_API_KEY: ${{ secrets.BINANCE_REAL_API_KEY }}
          BINANCE_REAL_API_SECRET: ${{ secrets.BINANCE_REAL_API_SECRET }}
          FIXIE_URL: ${{ secrets.FIXIE_URL }}
        run: |
          python test_real_binance_account.py

      - name: 🚀 Diagnose Cloud IP & Execute Live BNB Sell Order
        env:
          BINANCE_REAL_API_KEY: ${{ secrets.BINANCE_REAL_API_KEY }}
          BINANCE_REAL_API_SECRET: ${{ secrets.BINANCE_REAL_API_SECRET }}
        run: |
          python get_github_cloud_ip.py

      - name: 🚀 Execute 100-Account Live Matrix & Dynamic Market Rotation
        env:
          BINANCE_TESTNET: "true"
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_REAL_API_KEY: ${{ secrets.BINANCE_REAL_API_KEY }}
          BINANCE_REAL_API_SECRET: ${{ secrets.BINANCE_REAL_API_SECRET }}
          FIXIE_URL: ${{ secrets.FIXIE_URL }}
        run: |
          python parallel_simulation_matrix.py

      - name: 🔄 Commit & Push Updated Obsidian Notes and Matrix State
        run: |
          git config --global user.name "BinanceQuantBot[bot]"
          git config --global user.email "bot@binancequant.internal"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-Sync 24/7 Cloud Cycle [5m Cron]" && git push)
