name: ⚡ Manual Spot Trade Cycle Override

on:
  workflow_dispatch:

jobs:
  execute_force_trade:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Requirements
        run: |
          pip install -r requirements.txt

      - name: 🚀 EXECUTE MANUAL SPOT PIPELINE CYCLE
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BINANCE_REAL_API_KEY: ${{ secrets.BINANCE_REAL_API_KEY }}
          BINANCE_REAL_API_SECRET: ${{ secrets.BINANCE_REAL_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_02: ${{ secrets.GEMINI_API_KEY_02 }}
          GEMINI_API_KEY_03: ${{ secrets.GEMINI_API_KEY_03 }}
          GEMINI_API_KEY_04: ${{ secrets.GEMINI_API_KEY_04 }}
          GEMINI_API_KEY_05: ${{ secrets.GEMINI_API_KEY_05 }}
          GEMINI_API_KEY_06: ${{ secrets.GEMINI_API_KEY_06 }}
          GEMINI_API_KEY_07: ${{ secrets.GEMINI_API_KEY_07 }}
          GEMINI_API_KEY_08: ${{ secrets.GEMINI_API_KEY_08 }}
          GEMINI_API_KEY_09: ${{ secrets.GEMINI_API_KEY_09 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          python data_fetcher.py
          python pipeline_processor.py
          
      - name: 💾 Commit & Push Risk State Updates
        run: |
          git config --global user.name 'antigravity-bot[bot]'
          git config --global user.email 'antigravity-bot[bot]@users.noreply.github.com'
          for i in 1 2 3; do
            git fetch origin main || true
            git reset --soft origin/main || true
            git add .
            git commit -m "chore: manual pipeline override sync [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" || break
            git push origin main && break || sleep 3
          done
