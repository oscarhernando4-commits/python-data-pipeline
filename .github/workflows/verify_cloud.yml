name: Verificacion Autonoma Nube (One-Time)

on:
  push:
    paths:
      - 'verify_autonomous_cloud.py'
      - '.github/workflows/verify_cloud.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Autonomous Verification Script
        env:
          BINANCE_REAL_API_KEY: ${{ secrets.BINANCE_REAL_API_KEY }}
          BINANCE_REAL_API_SECRET: ${{ secrets.BINANCE_REAL_API_SECRET }}
          FIXIE_URL: ${{ secrets.FIXIE_URL }}
        run: python verify_autonomous_cloud.py
